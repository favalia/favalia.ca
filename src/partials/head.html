<!-- Consent first: Google Analytics 4 ({{site:ga4}}) and Tag Manager ({{site:gtm}}) only load after the visitor
     agrees (assets/js/consent.js shows the banner). Google Consent Mode v2 starts with everything denied. -->
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', {
  ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
  analytics_storage: 'denied', personalization_storage: 'denied',
  functionality_storage: 'granted', security_storage: 'granted'
});
gtag('set', 'ads_data_redaction', true);
(function (w, d) {
  var GA = '{{site:ga4}}', GTM = '{{site:gtm}}', KEY = 'favalia-consent', VERSION = 1, MAX_AGE = 365 * 864e5;
  var loaded = {}, choice = null;
  function add(src) { var s = d.createElement('script'); s.async = true; s.src = src; d.head.appendChild(s); }
  function apply(c) {
    gtag('consent', 'update', {
      analytics_storage: c.analytics ? 'granted' : 'denied',
      ad_storage: c.marketing ? 'granted' : 'denied',
      ad_user_data: c.marketing ? 'granted' : 'denied',
      ad_personalization: c.marketing ? 'granted' : 'denied'
    });
    if (c.analytics && !loaded.ga) { loaded.ga = 1; add('https://www.googletagmanager.com/gtag/js?id=' + GA); gtag('js', new Date()); gtag('config', GA); }
    if ((c.analytics || c.marketing) && !loaded.gtm) { loaded.gtm = 1; w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' }); add('https://www.googletagmanager.com/gtm.js?id=' + GTM); }
    w.dataLayer.push({ event: 'favalia_consent', consent_analytics: !!c.analytics, consent_marketing: !!c.marketing });
  }
  try { choice = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!choice || choice.v !== VERSION || !(Date.now() - choice.t < MAX_AGE)) choice = null;
  w.favaliaConsent = {
    get: function () { return choice; },
    save: function (analytics, marketing) {
      choice = { v: VERSION, t: Date.now(), analytics: !!analytics, marketing: !!marketing };
      try { localStorage.setItem(KEY, JSON.stringify(choice)); } catch (e) {}
      apply(choice);
      return choice;
    }
  };
  if (choice) apply(choice);
})(window, document);
</script>
